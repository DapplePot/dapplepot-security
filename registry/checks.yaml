# ─────────────────────────────────────────────────────────────────────────────
# DapplePot — Central Check Registry (SOURCE OF TRUTH)
#
# 20 OWASP signals · 155 sub-checks (EA-01b deleted; redundant with IPA-01a)
#
# Downstream artifacts are GENERATED from here — never hand-edit them:
#   - dapplepot-ui/src/data/signalRegistry.ts    (via gen_ts.py)
#   - dapplepot-security/scripts/signal_registry_seed.py  (via gen_seed.py)
#   - dapplepot-sdk enforceable-set              (via gen_sdk.py)
#
# When adding or changing a check, edit this file and re-run codegen.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Schema reference ────────────────────────────────────────────────────────
# signal fields: id, name, framework (LLM|ASI), number (1-10), description
# check  fields:
#   id, label, score, severity, confidence_tier
#   scope           event | session | history
#                     event   — can fire on a single event; eligible for Runtime Guard
#                     session — evaluated post-session. Includes both multi-event
#                               patterns (drift, sequences, aggregates) AND
#                               single-event content scans that need LLM
#                               reasoning (e.g. SPL-01a). Not Guard-enforceable
#                     history — needs multi-session history (cross-session queries)
#   subject         agent | user | tenant
#   mechanism       policy | signature | statistical | behavioral | model
#   enforceable     bool — has Runtime Guard impl today
#   capable_modes   subset of [observe, detect, enforce]
#   default_mode    where a new agent starts
#   capable_actions subset of [alert, sanitize, block_call, terminate_session]
#   default_action  action when enforcing (only if enforceable)
#   event_types     which events the check evaluates
#   detector        Python dotted ref to implementation (or null)
#   requires_policy_fields  Governance fields this check reads
#   status          active | coming-soon | not-applicable
#   status_reason   required when status != active
#   matches         optional human-readable pattern descriptions (UI only)
# ─────────────────────────────────────────────────────────────────────────────


signals:

  # ═══════════════════════════════════════════════════════════════════════════
  # LLM FRAMEWORK
  # ═══════════════════════════════════════════════════════════════════════════

  - id: OW-LLM01
    name: Prompt Injection
    framework: OW-LLM
    number: 1
    description: >
      Attempts to override model instructions via user-supplied or retrieved
      content, including indirect injection through RAG, APIs, files, and
      multi-turn jailbreaks.
    checks:

      - id: PI-01a
        label: Role-override phrase match
        score: 85
        severity: high
        confidence_tier: high
        scope: event
        subject: agent
        mechanism: signature
        enforceable: true
        capable_modes: [observe, detect, enforce]
        default_mode: detect
        capable_actions: [alert, sanitize, block_call, terminate_session]
        default_action: alert
        event_types: [llm_start, llm_end, tool_start, tool_end]
        detector: detectors.injection.detect_injection
        requires_policy_fields: []
        status: active
        matches:
          - "ignore/disregard/forget … instructions"
          - "you must/shall/will … do/execute/perform"
          - "new instruction / new task / new directive"
          - "override/bypass/circumvent … filter/restriction"

      - id: PI-01b
        label: Delimiter smuggling
        score: 90
        severity: critical
        confidence_tier: deterministic
        scope: event
        subject: agent
        mechanism: signature
        enforceable: true
        capable_modes: [observe, detect, enforce]
        default_mode: detect
        capable_actions: [alert, sanitize, block_call, terminate_session]
        default_action: alert
        event_types: [llm_start, llm_end, tool_start, tool_end]
        detector: detectors.injection.detect_injection
        requires_policy_fields: []
        status: active
        matches:
          - "```system / ``` role-boundary sequences"
          - "### System: / [SYS] / ---SYSTEM--- delimiters"
          - "Role-boundary smuggling via turn separators"

      - id: PI-01c
        label: Encoded / obfuscated payload
        score: 75
        severity: high
        confidence_tier: high
        scope: event
