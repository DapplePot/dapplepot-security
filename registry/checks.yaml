        detector: detectors.disclosure.detect_pii
        requires_policy_fields: []
        status: active
        matches:
          - "sk-[a-zA-Z0-9]{32,}  (OpenAI / generic sk- key)"
          - "ghp_[36 chars]  (GitHub personal token)"
          - "AKIA[A-Z0-9]{16}  (AWS access key)"
          - "Bearer [32+ chars]  (OAuth / API bearer)"

      - id: SID-01b
