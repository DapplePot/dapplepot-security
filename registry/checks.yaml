  - id: OW-LLM06
    name: Excessive Agency
    framework: OW-LLM
    number: 6
    description: >
      Agent exceeds its authorised tool scope, requests elevated permissions,
      performs irreversible actions, or self-modifies its system prompt.
    checks:

      # NOTE: EA-01b removed from catalog — fully redundant with IPA-01a (OW-ASI03).

      - id: EA-01a
        label: Tool not in approved manifest invoked
        score: 80
        severity: high
        confidence_tier: deterministic
        scope: event
        subject: agent
        mechanism: policy
        enforceable: true
        capable_modes: [observe, detect, enforce]
        default_mode: detect
        capable_actions: [alert, block_call, terminate_session]
        default_action: block_call
        event_types: [tool_start]
        detector: detectors.agentic.detect_agent_threats_on_tool_start
        requires_policy_fields: [tool_manifest]
        status: active

      - id: EA-01c
        label: Data written outside designated namespace
        score: 75
        severity: high
        confidence_tier: high
        # Manual mode (write_namespace declared) is Event-scope and enforceable at
        # tool_start. Auto mode (no namespace declared) stays Session-scope in
        # post-session — the read-intent heuristic can't run at a single event.
        scope: event
        subject: agent
        mechanism: policy
        enforceable: true
        capable_modes: [observe, detect, enforce]
        default_mode: detect
        capable_actions: [alert, block_call, terminate_session]
        default_action: block_call
        event_types: [tool_start]
        detector: scorer.llm_signals.check_ea_01c_write_namespace
        requires_policy_fields: [write_namespace, working_directory]
        status: active

      - id: EA-02a
        label: Irreversible action without confirm gate
        score: 85
        severity: high
        confidence_tier: high
        # Manual mode (tool_approval_policy declared with 'needs_approval' or
        # 'always_block' entries) is Event-scope and enforceable at tool_start:
        # the SDK blocks the call when the tool is listed but no confirm gate
        # tool has been invoked earlier this session. Auto mode (irreversible
        # regex heuristic) stays Session-scope in post-session analysis.
        scope: event
        subject: agent
        mechanism: policy
        enforceable: true
        capable_modes: [observe, detect, enforce]
        default_mode: detect
        capable_actions: [alert, block_call, terminate_session]
        default_action: block_call
        event_types: [tool_start]
        detector: scorer.asi_signals.check_irreversible_no_confirm
