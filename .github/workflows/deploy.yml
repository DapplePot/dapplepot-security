name: Deploy Security

on:
  push:
    branches: [master]
    paths-ignore:
      - "services/model/reflex/**"
      - ".github/workflows/deploy-reflex.yml"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/dapplepot/dapplepot-security

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Security on VM
        run: |
          gcloud compute ssh "${{ secrets.GCE_INSTANCE }}" \
            --zone "${{ secrets.GCE_ZONE }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --tunnel-through-iap \
            --strict-host-key-checking=no \
            --command "
              set -e
              echo '${{ secrets.GITHUB_TOKEN }}' | sudo docker login ghcr.io -u '${{ github.actor }}' --password-stdin
              sudo docker compose -f /opt/dapplepot/docker-compose.yml pull security
              sudo docker compose -f /opt/dapplepot/docker-compose.yml up -d --no-deps security
              sudo docker image prune -f
            "
